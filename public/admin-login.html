<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin login · Xen Photobooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <main class="login-card">
        <a class="login-brand" href="photobooth.html">← Back to photobooth</a>
        <h1>Admin <em>login</em></h1>
            <p class="hint">Edit layouts, templates, and frames here. Admin credentials are set in the server environment.</p>
        <form id="loginForm" autocomplete="on">
            <label>Username<input id="user" type="text" autocomplete="username" required autofocus></label>
            <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
            <p id="msg" class="form-msg" role="alert"></p>
            <button class="btn primary" type="submit">Log in</button>
        </form>
    </main>
    <script>
        const msg = document.getElementById("msg");
        const form = document.getElementById("loginForm");
        const submitButton = form.querySelector('button[type="submit"]');
        fetch("/api/admin/session", { credentials: "same-origin" })
            .then((response) => { if (response.ok) location.replace("admin.html"); })
            .catch(() => { msg.textContent = "Could not connect to the admin service. Try again."; });
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            submitButton.disabled = true;
            msg.textContent = "";
            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("user").value.trim(),
                        password: document.getElementById("pass").value
                    })
                });
                const result = await response.json();
                if (response.ok && result.authenticated) {
                    sessionStorage.setItem("xenAdmin", "1");
                    location.href = "admin.html";
                    return;
                }
                msg.textContent = result.error || "Could not log in. Please try again.";
            } catch (error) {
                console.error("Admin login request failed", error);
                msg.textContent = "Could not connect to the admin service. Check your connection and try again.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
